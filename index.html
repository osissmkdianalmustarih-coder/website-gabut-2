<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seberapa Kenal Kamu Sama Dafiiii? 💕</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9ecb, #b58cff);
            overflow-x: hidden;
            color: white;
        }

        /* Hati background */
        .hearts {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .heart {
            position: absolute;
            bottom: -50px;
            font-size: 25px;
            animation: naik 8s linear infinite;
            opacity: 0.7;
        }

        @keyframes naik {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 2;
            width: 92%;
            max-width: 650px;
            margin: 50px auto;
        }

        .card {
            background: rgba(255,255,255,0.18);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .progress-container {
            margin: 20px 0;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .progress {
            height: 10px;
            background: rgba(255,255,255,0.3);
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 10%;
            background: white;
            border-radius: 20px;
            transition: 0.4s;
        }

        .question {
            font-size: 23px;
            font-weight: bold;
            margin: 25px 0;
            line-height: 1.4;
        }

        .answers {
            display: grid;
            gap: 12px;
        }

        .answer {
            padding: 15px;
            border: 2px solid rgba(255,255,255,0.35);
            border-radius: 15px;
            background: rgba(255,255,255,0.12);
            color: white;
            cursor: pointer;
            transition: 0.25s;
            font-size: 16px;
        }

        .answer:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .answer.selected {
            background: white;
            color: #c24b91;
            border-color: white;
        }

        .next-btn {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 15px;
            background: white;
            color: #c24b91;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .next-btn:hover {
            transform: scale(1.02);
        }

        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Hasil */
        .result {
            display: none;
            text-align: center;
        }

        .score-circle {
            width: 170px;
            height: 170px;
            margin: 25px auto;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: 5px solid white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .score-circle strong {
            font-size: 45px;
        }

        .result-message {
            font-size: 20px;
            margin: 20px 0;
            line-height: 1.5;
        }

        .name-input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            margin-bottom: 10px;
            outline: none;
            font-size: 16px;
        }

        /* Admin */
        .admin-button {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: white;
            color: #c24b91;
            font-size: 22px;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 5px 20px rgba(0,0,0,0.25);
        }

        .admin-panel {
            display: none;
            position: fixed;
            z-index: 20;
            inset: 0;
            background: rgba(0,0,0,0.65);
            padding: 20px;
            overflow-y: auto;
        }

        .admin-box {
            max-width: 1000px;
            margin: 30px auto;
            background: white;
            color: #333;
            border-radius: 20px;
            padding: 25px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-admin {
            border: none;
            background: #ff5d8f;
            color: white;
            border-radius: 10px;
            padding: 8px 12px;
            cursor: pointer;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .admin-table th,
        .admin-table td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        .admin-table th {
            background: #ffe2ed;
        }

        .detail-btn {
            border: none;
            background: #c24b91;
            color: white;
            padding: 7px 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .delete-btn {
            border: none;
            background: #e74c3c;
            color: white;
            padding: 7px 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        .answer-detail {
            margin-top: 20px;
            padding: 15px;
            background: #fff0f6;
            border-radius: 15px;
            display: none;
        }

        @media(max-width:600px) {
            .container {
                margin: 20px auto;
            }

            .card {
                padding: 22px;
            }

            .header h1 {
                font-size: 25px;
            }

            .question {
                font-size: 20px;
            }

            .admin-table {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<!-- Hati animasi -->
<div class="hearts" id="hearts"></div>

<div class="container">

    <div class="card">

        <!-- QUIZ -->
        <div id="quiz">

            <div class="header">
                <h1>💕 Seberapa Kenal Kamu Sama Aku?</h1>
                <p>Jawab pertanyaannya dengan jujur ya ❤️</p>
            </div>

            <input
                type="text"
                id="nameInput"
                class="name-input"
                placeholder="Masukkan nama kamu..."
            >

            <div class="progress-container">
                <div class="progress-text">
                    <span id="progressText">Pertanyaan 1 dari 10</span>
                    <span id="percent">10%</span>
                </div>

                <div class="progress">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>

            <div class="question" id="question"></div>

            <div class="answers" id="answers"></div>

            <button class="next-btn" id="nextBtn" disabled>
                Selanjutnya 💕
            </button>

        </div>


        <!-- HASIL -->
        <div class="result" id="result">

            <div class="header">
                <h1>💖 Selesai!</h1>
                <p>Ini hasil seberapa kenal kamu sama aku</p>
            </div>

            <div class="score-circle">
                <strong id="score">0</strong>
                <span>/ 100</span>
            </div>

            <div class="result-message" id="resultMessage"></div>

            <button class="next-btn" onclick="location.reload()">
                🔄 Coba Lagi
            </button>

        </div>

    </div>
</div>


<!-- Tombol Admin -->
<button class="admin-button" onclick="openAdmin()">🔒</button>


<!-- ADMIN PANEL -->
<div class="admin-panel" id="adminPanel">

    <div class="admin-box">

        <div class="admin-header">
            <h2>🔐 Admin Panel</h2>

            <button class="close-admin" onclick="closeAdmin()">
                Tutup
            </button>
        </div>

        <p>
            Di sini kamu bisa melihat siapa saja yang sudah mengisi
            dan berapa skor mereka.
        </p>

        <table class="admin-table">

            <thead>
                <tr>
                    <th>Nama</th>
                    <th>Skor</th>
                    <th>Persentase</th>
                    <th>Waktu</th>
                    <th>Aksi</th>
                </tr>
            </thead>

            <tbody id="adminData"></tbody>

        </table>

        <div class="answer-detail" id="answerDetail"></div>

    </div>

</div>


<script>

    /*
    ====================================
    DATA PERTANYAAN
    ====================================
    */

    const questions = [

        {
            question: "Kapan aku lahir?",
            answers: [
                "5 Desember 2009",
                "10 Desember 2009",
                "5 November 2009",
                "15 Desember 2008"
            ],
            correct: 0
        },

        {
            question: "Warna apa yang aku suka?",
            answers: [
                "Merah",
                "Biru",
                "Hijau",
                "Hitam"
            ],
            correct: 1
        },

        {
            question: "Makanan yang aku suka?",
            answers: [
                "Mie ayam",
                "Bakso",
                "Nasi goreng",
                "Sate"
            ],
            correct: 2
        },

        {
            question: "Kalau aku bosan, biasanya aku ngapain?",
            answers: [
                "Tidur",
                "Main HP",
                "Belajar",
                "Beres-beres"
            ],
            // Silakan ubah jawaban yang benar
            correct: 1
        },

        {
            question: "Aku paling suka apa?",
            answers: [
                "Main game",
                "VC",
                "Jalan-jalan",
                "Nonton film"
            ],
            correct: 1
        },

        {
            question: "Minuman apa yang paling aku suka?",
            answers: [
                "Es teh",
                "Kopi",
                "Jus",
                "Air putih"
            ],
            // Silakan ubah
            correct: 0
        },

        {
            question: "Aku lebih suka pergi keluar atau di rumah?",
            answers: [
                "Pergi keluar",
                "Di rumah",
                "Terserah",
                "Tidak suka keduanya"
            ],
            // Silakan ubah
            correct: 0
        },

        {
            question: "Aku lebih suka chat atau telepon?",
            answers: [
                "Chat",
                "Telepon",
                "Keduanya",
                "Tidak suka komunikasi"
            ],
            // Silakan ubah
            correct: 1
        },

        {
            question: "Apa yang paling bikin aku senang?",
            answers: [
                "Dikasih perhatian",
                "Dikasih uang",
                "Tidur",
                "Main sendiri"
            ],
            // Silakan ubah
            correct: 0
        },

        {
            question: "Kalau kita punya waktu luang bersama, aku paling ingin...",
            answers: [
                "VC / ngobrol",
                "Jalan-jalan",
                "Makan bersama",
                "Nonton"
            ],
            // Silakan ubah
            correct: 0
        }

    ];


    /*
    ====================================
    VARIABEL
    ====================================
    */

    let currentQuestion = 0;
    let score = 0;
    let selectedAnswer = null;
    let userAnswers = [];


    /*
    ====================================
    TAMPILKAN PERTANYAAN
    ====================================
    */

    function showQuestion() {

        const q = questions[currentQuestion];

        document.getElementById("question").textContent =
            q.question;

        document.getElementById("progressText").textContent =
            `Pertanyaan ${currentQuestion + 1} dari ${questions.length}`;

        const percent =
            ((currentQuestion + 1) / questions.length) * 100;

        document.getElementById("percent").textContent =
            percent + "%";

        document.getElementById("progressBar").style.width =
            percent + "%";

        const answersContainer =
            document.getElementById("answers");

        answersContainer.innerHTML = "";

        selectedAnswer = null;

        document.getElementById("nextBtn").disabled = true;

        q.answers.forEach((answer, index) => {

            const button = document.createElement("button");

            button.className = "answer";

            button.textContent = answer;

            button.onclick = function () {

                document
                    .querySelectorAll(".answer")
                    .forEach(btn => btn.classList.remove("selected"));

                button.classList.add("selected");

                selectedAnswer = index;

                document.getElementById("nextBtn").disabled = false;

            };

            answersContainer.appendChild(button);

        });

    }


    /*
    ====================================
    NEXT BUTTON
    ====================================
    */

    document.getElementById("nextBtn").onclick = function () {

        if (selectedAnswer === null) return;

        const q = questions[currentQuestion];

        userAnswers.push({
            question: q.question,
            selected: q.answers[selectedAnswer],
            correct: q.answers[q.correct]
        });

        if (selectedAnswer === q.correct) {
            score++;
        }

        currentQuestion++;

        if (currentQuestion < questions.length) {

            showQuestion();

        } else {

            showResult();

        }

    };


    /*
    ====================================
    HASIL
    ====================================
    */

    function showResult() {

        document.getElementById("quiz").style.display = "none";

        document.getElementById("result").style.display = "block";

        const finalScore =
            score * 10;

        document.getElementById("score").textContent =
            finalScore;

        let message = "";

        if (finalScore === 100) {

            message =
                "😍 PERFECT! Kamu benar-benar hafal semua tentang aku! ❤️";

        } else if (finalScore >= 80) {

            message =
                "🥰 Wah, kamu kenal banget sama aku! ❤️";

        } else if (finalScore >= 60) {

            message =
                "😊 Lumayan! Tapi masih ada beberapa hal tentang aku yang harus kamu tahu.";

        } else if (finalScore >= 40) {

            message =
                "😅 Hmm... sepertinya kamu harus lebih mengenal aku lagi.";

        } else {

            message =
                "😭 Waduh... kayaknya kita harus lebih sering ngobrol nih.";

        }

        document.getElementById("resultMessage").textContent =
            message;


        /*
        Simpan hasil ke localStorage
        */

        const name =
            document.getElementById("nameInput").value.trim()
            || "Anonim";

        const results =
            JSON.parse(localStorage.getItem("quizResults") || "[]");

        results.push({

            id: Date.now(),

            name: name,

            score: finalScore,

            answers: userAnswers,

            date: new Date().toLocaleString("id-ID")

        });

        localStorage.setItem(
            "quizResults",
            JSON.stringify(results)
        );

    }


    /*
    ====================================
    ADMIN
    ====================================
    */

    function openAdmin() {

        const password =
            prompt("Masukkan password admin:");

        /*
        GANTI PASSWORD DI SINI
        */

        if (password !== "MatuppGanteng") {

            alert("❌ Password salah!");

            return;

        }

        document.getElementById("adminPanel").style.display =
            "block";

        loadAdminData();

    }


    function closeAdmin() {

        document.getElementById("adminPanel").style.display =
            "none";

        document.getElementById("answerDetail").style.display =
            "none";

    }


    /*
    ====================================
    DATA ADMIN
    ====================================
    */

    function loadAdminData() {

        const tbody =
            document.getElementById("adminData");

        const results =
            JSON.parse(
                localStorage.getItem("quizResults") || "[]"
            );

        tbody.innerHTML = "";

        if (results.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="5" class="empty">
                        Belum ada yang mengisi 💔
                    </td>
                </tr>
            `;

            return;

        }

        results.reverse().forEach(result => {

            const row =
                document.createElement("tr");

            row.innerHTML = `

                <td>${result.name}</td>

                <td>
                    <strong>${result.score}/100</strong>
                </td>

                <td>${result.score}%</td>

                <td>${result.date}</td>

                <td>

                    <button
                        class="detail-btn"
                        onclick="showDetail(${result.id})">
                        Lihat
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteResult(${result.id})">
                        Hapus
                    </button>

                </td>

            `;

            tbody.appendChild(row);

        });

    }


    /*
    ====================================
    LIHAT JAWABAN
    ====================================
    */

    function showDetail(id) {

        const results =
            JSON.parse(
                localStorage.getItem("quizResults") || "[]"
            );

        const result =
            results.find(item => item.id === id);

        if (!result) return;

        let html = `
            <h3>💌 Jawaban ${result.name}</h3>

            <p>
                <strong>Skor:</strong>
                ${result.score}/100
            </p>

            <br>
        `;

        result.answers.forEach((item, index) => {

            const benar =
                item.selected === item.correct;

            html += `

                <div style="
                    margin-bottom:15px;
                    padding:12px;
                    background:white;
                    border-radius:10px;
                ">

                    <strong>
                        ${index + 1}. ${item.question}
                    </strong>

                    <br><br>

                    Jawaban:
                    <strong>
                        ${item.selected}
                    </strong>

                    <br>

                    Jawaban benar:
                    <strong>
                        ${item.correct}
                    </strong>

                    <br><br>

                    ${
                        benar
                        ? "✅ Benar"
                        : "❌ Salah"
                    }

                </div>

            `;

        });

        const detail =
            document.getElementById("answerDetail");

        detail.innerHTML = html;

        detail.style.display = "block";

        detail.scrollIntoView({
            behavior: "smooth"
        });

    }


    /*
    ====================================
    HAPUS HASIL
    ====================================
    */

    function deleteResult(id) {

        if (!confirm("Hapus hasil ini?")) return;

        let results =
            JSON.parse(
                localStorage.getItem("quizResults") || "[]"
            );

        results =
            results.filter(item => item.id !== id);

        localStorage.setItem(
            "quizResults",
            JSON.stringify(results)
        );

        loadAdminData();

        document.getElementById("answerDetail").style.display =
            "none";

    }


    /*
    ====================================
    ANIMASI HATI
    ====================================
    */

    function createHeart() {

        const heart =
            document.createElement("div");

        heart.className = "heart";

        heart.textContent =
            ["❤️", "💕", "💗", "💖", "💘"]
            [Math.floor(Math.random() * 5)];

        heart.style.left =
            Math.random() * 100 + "%";

        heart.style.fontSize =
            (15 + Math.random() * 25) + "px";

        heart.style.animationDuration =
            (5 + Math.random() * 5) + "s";

        document
            .getElementById("hearts")
            .appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 10000);

    }

    setInterval(createHeart, 500);


    /*
    ====================================
    MULAI
    ====================================
    */

    showQuestion();

</script>

</body>
</html>
